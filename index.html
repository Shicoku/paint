<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <canvas id="canvas" width="400" height="400" style="border: 1px solid #000"></canvas>
    <button id="clear">Clear</button>

    <div><button type="button" class="dial"></button></div>
    <script src="./src/index.ts"></script>
    <script src="./src/util/dial.ts"></script>
  </body>

  <style>
    .dial {
      position: relative;
      border: 10px solid #939292;
      border-radius: 50%;
      padding: 0;
      width: 100px;
      height: 100px;
      background: #939292;
      cursor: pointer;
    }
    .dial::-moz-focus-inner {
      border: none;
      padding: 0;
    }
    .dial::before {
      position: absolute;
      top: calc(50% - 10px);
      right: 10px;
      border-radius: 50%;
      width: 15px;
      height: 15px;
      background-color: rgba(255, 255, 255, 0.6);
      content: "";
    }
  </style>
</html>
