<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div class="canvas">
      <canvas id="canvasPaint" width="400" height="400"></canvas>
      <canvas id="canvasPointer" width="400" height="400" style="border: 1px solid #000"></canvas>
    </div>
    <button id="clear">Clear</button>

    <div class="dial-wrap">
      <div><button type="button" class="dial dial-x"></button></div>
      <div><button type="button" class="dial dial-y"></button></div>
    </div>
    <p><span id="x-out">0</span>, <span id="y-out">0</span></p>
    <div><input type="checkbox" name="painting" id="painting" /></div>
    <div>
      <input type="range" id="pointerSize" name="voolume" min="1" max="100" value="6" />
      <label for="size" id="sizeText">6</label>
    </div>
    <div><button id="dl">画像を保存</button></div>
    <script src="./src/index.ts"></script>
    <!-- <script src="./src/util/dial.ts"></script> -->
  </body>
</html>
